# Host-native LLM tiers (macOS / Apple Silicon).
#
# Docker Desktop cannot pass Metal into a Linux container, so on a Mac the
# inference tiers run as native processes (`make llm-up`) and the containers
# reach them through host.docker.internal. Enable this override from .env:
#
#   COMPOSE_FILE=docker-compose.yaml:docker-compose.host-llm.yaml
#
# The CPU containers stay available with:  docker compose --profile cpu-fallback up -d llm_service
services:
  llm_service:
    profiles: [cpu-fallback]
  llm_service_standard:
    profiles: [cpu-fallback]
  orchestrator:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LLM_HOST: host.docker.internal
      LLM_PORT: "50051"
      LLM_HEAVY_HOST: host.docker.internal:50051
      LLM_STANDARD_HOST: host.docker.internal:50061
