syntax = "proto3";
package llm;

service LLMService {
  // Streaming text generation
  rpc Generate(GenerateRequest) returns (stream GenerateResponse);

  // Batch generation for self-consistency scoring (Phase 2: Agent0)
  rpc GenerateBatch(GenerateBatchRequest) returns (GenerateBatchResponse);

  // LIDM: Model introspection RPCs
  rpc GetActiveModel(GetActiveModelRequest) returns (GetActiveModelResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
}

message GenerateRequest {
  string prompt = 1;
  int32 max_tokens = 2;
  float temperature = 3;
  string response_format = 4;
}

message GenerateResponse {
  string token = 1;
  bool is_final = 2;
  bool is_valid_json = 3;
  string finish_reason = 4;          // final chunk only: "stop" | "length"
  Usage usage = 5;                   // final chunk only: exact counts and server-side timings
}

// Measured by the LLM service itself, so clients need not estimate tokens or
// subtract gRPC/Python overhead. Token counts come from the model's tokenizer.
message Usage {
  int32 prompt_tokens = 1;           // prompt after tokenization, incl. BOS
  int32 completion_tokens = 2;       // generated tokens, excluding the end-of-text token
  float tokens_per_sec = 3;          // decode: (completion_tokens - 1) / decode time
  int32 cached_prompt_tokens = 4;    // prompt prefix reused from the KV cache, not recomputed
  float queue_ms = 5;                // waiting for the engine (another request was running)
  float prefill_ms = 6;              // engine start -> first token sampled
  float decode_ms = 7;               // first token -> last token
  float prefill_tokens_per_sec = 8;  // (prompt_tokens - cached_prompt_tokens) / prefill time
}

// Phase 2: Batch generation for self-consistency scoring
message GenerateBatchRequest {
  string prompt = 1;
  int32 num_samples = 2;      // k responses to generate
  int32 max_tokens = 3;
  float temperature = 4;
  string response_format = 5;
}

message GenerateBatchResponse {
  repeated string responses = 1;           // k generated responses
  float self_consistency_score = 2;        // p̂ = proportion agreeing with majority
  string majority_answer = 3;              // Most common answer
  int32 majority_count = 4;                // How many responses agree
}

// LIDM: Model introspection messages
message GetActiveModelRequest {}
message GetActiveModelResponse {
  string model_name = 1;
  string model_filename = 2;
  int32 context_window = 3;
  int32 max_tokens = 4;
  repeated string capabilities = 5;
  string tier = 6;
  string backend = 7;
  string device = 8;   // cpu | metal | cuda (what actually runs the model)
  string engine = 9;   // llamacpp | mlx
}

message ListModelsRequest {}
message ModelInfo {
  string filename = 1;
  string name = 2;
  int32 context_window = 3;
  int32 recommended_ctx = 4;
  repeated string capabilities = 5;
  string tier = 6;
}
message ListModelsResponse {
  repeated ModelInfo models = 1;
  string active_model = 2;
}
